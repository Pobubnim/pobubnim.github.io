# GitHub Pages собирает сайт Jekyll'ом. Без этого списка на pobubnim.ru публиковались
# служебные папки репозитория: docs/ (передача дел, планы, Директ), tools/ (скрипты),
# videos/ (исходник ролика с файлами агента), promo/ и data/ — робот мог забрать их
# в индекс мусорными страницами. Сайт на них не ссылается (проверено 17.09.2026).
# ВАЖНО: косая черта в конце обязательна. Jekyll исключает не только совпадение,
# но и всё, что НАЧИНАЕТСЯ с записи: строка «videos» уносила с прода
# videosemka-moskva.html (поймано проверкой прода 17.09, страница отдавала 404).
exclude:
  - docs/
  - tools/
  - videos/
  - promo/
  - data/
  - README.md
  - AGENTS.md
